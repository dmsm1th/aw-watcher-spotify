[project]
name = "aw-watcher-spotify"
version = "0.3.0"
description = "Spotify watcher for ActivityWatch (AppleScript, no Web API)"
authors = [{ name = "Erik Bjäreholt", email = "erik@bjareho.lt" }]
license = { text = "MPL-2.0" }
requires-python = ">=3.7"
dependencies = [
    "aw-client>=0.5.7",
]

[project.scripts]
aw-watcher-spotify = "aw_watcher_spotify:main"

[project.urls]
Repository = "https://github.com/ActivityWatch/aw-watcher-spotify"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"
